[workspace]
resolver = "2"
members = ["crates/rlp", "crates/linecaller-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["LineCaller contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tracing = "0.1"
socket2 = { version = "0.6", features = ["all"] }
rlp = { path = "crates/rlp", package = "linecaller-rlp" }
linecaller-core = { path = "crates/linecaller-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
